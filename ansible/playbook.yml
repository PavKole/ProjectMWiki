---
# ==============================================================
# Playbook автоматического развёртывания MediaWiki, Nginx и PostgreSQL
# ==============================================================

# ---------- Часть 1. Подготовка всех серверов ----------
- name: Общая подготовка всех узлов
  hosts: all
  become: yes
  tasks:
    - name: Установить базовые пакеты (curl, ntp, htop)
      apt:
        name:
          - curl
          - ntp
          - htop
        state: present
        update_cache: yes

    - name: Запустить и включить NTP
      systemd:
        name: ntp
        state: started
        enabled: yes

# ---------- Часть 2. Настройка серверов баз данных ----------
- name: Настройка PostgreSQL (primary и replica)
  hosts: db
  become: yes
  vars:
    postgresql_version: "14"
    repuser_password: "rep_password"
    wikiuser_password: "wiki_password"
  tasks:
    - name: Установить PostgreSQL
      apt:
        name:
          - postgresql
          - postgresql-contrib
        state: present

    - name: Запустить и включить PostgreSQL
      systemd:
        name: postgresql
        state: started
        enabled: yes

    - name: Изменить параметры PostgreSQL для primary (только на db1)
      become_user: postgres
      postgresql_set:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
      loop:
        - { name: "listen_addresses", value: "'*'" }
        - { name: "wal_level", value: "replica" }
        - { name: "max_wal_senders", value: "3" }
        - { name: "hot_standby", value: "on" }
      when: inventory_hostname == 'db1'

    - name: Создать пользователя repuser для репликации (только на db1)
      become_user: postgres
      postgresql_user:
        name: repuser
        password: "{{ repuser_password }}"
        role_attr_flags: REPLICATION,LOGIN
      when: inventory_hostname == 'db1'

    - name: Создать пользователя wikiuser для MediaWiki (только на db1)
      become_user: postgres
      postgresql_user:
        name: wikiuser
        password: "{{ wikiuser_password }}"
      when: inventory_hostname == 'db1'

    - name: Создать базу данных my_wiki (только на db1)
      become_user: postgres
      postgresql_db:
        name: my_wiki
        owner: wikiuser
      when: inventory_hostname == 'db1'

    - name: Добавить запись в pg_hba.conf для подключения приложений (db1)
      lineinfile:
        path: "/etc/postgresql/{{ postgresql_version }}/main/pg_hba.conf"
        line: "host    all             wikiuser        192.168.0.0/24            md5"
        insertafter: EOF
      when: inventory_hostname == 'db1'

    - name: Добавить запись в pg_hba.conf для репликации (db1)
      lineinfile:
        path: "/etc/postgresql/{{ postgresql_version }}/main/pg_hba.conf"
        line: "host    replication     repuser         192.168.0.0/24            md5"
        insertafter: EOF
      when: inventory_hostname == 'db1'

    - name: Перезапустить PostgreSQL после изменений (db1)
      systemd:
        name: postgresql
        state: restarted
      when: inventory_hostname == 'db1'

# ---------- Часть 3. Настройка NFS-сервера ----------
- name: Настройка NFS-сервера
  hosts: nfs
  become: yes
  tasks:
    - name: Установить nfs-kernel-server
      apt:
        name: nfs-kernel-server
        state: present

    - name: Создать каталог для общих файлов MediaWiki
      file:
        path: /srv/nfs/mediawiki
        state: directory
        owner: www-data
        group: www-data
        mode: '0755'

    - name: Настроить экспорт каталога
      lineinfile:
        path: /etc/exports
        line: "/srv/nfs/mediawiki 192.168.0.0/24(rw,sync,no_subtree_check,no_root_squash)"
        create: yes

    - name: Применить экспорт и перезапустить NFS
      shell: |
        exportfs -a
        systemctl restart nfs-kernel-server

# ---------- Часть 4. Настройка серверов приложений MediaWiki ----------
- name: Настройка серверов приложений
  hosts: app
  become: yes
  vars:
    mediawiki_version: "1.42.1"
    db_host: "192.168.0.109"
    nfs_server: "192.168.0.111"
  tasks:
    - name: Установить Nginx, PHP-FPM и расширения
      apt:
        name:
          - nginx
          - php-fpm
          - php-pgsql
          - php-intl
          - php-mbstring
          - php-xml
          - php-apcu
          - php-curl
          - nfs-common
          - rsync
        state: present

    - name: Запустить и включить Nginx и PHP-FPM
      systemd:
        name: "{{ item }}"
        state: started
        enabled: yes
      loop:
        - nginx
        - php8.1-fpm

    - name: Создать каталог для MediaWiki
      file:
        path: /var/www/mediawiki
        state: directory
        owner: www-data
        group: www-data
        mode: '0755'

    - name: Смонтировать NFS-каталог images
      mount:
        path: /var/www/mediawiki/images
        src: "{{ nfs_server }}:/srv/nfs/mediawiki"
        fstype: nfs
        opts: defaults
        state: mounted

    - name: Скачать MediaWiki
      get_url:
        url: "https://releases.wikimedia.org/mediawiki/{{ mediawiki_version }}/mediawiki-{{ mediawiki_version }}.tar.gz"
        dest: /tmp/mediawiki.tar.gz

    - name: Распаковать архив MediaWiki
      unarchive:
        src: /tmp/mediawiki.tar.gz
        dest: /tmp
        remote_src: yes

    - name: Скопировать файлы MediaWiki в /var/www/mediawiki
      shell: rsync -av --exclude='images' /tmp/mediawiki-{{ mediawiki_version }}/ /var/www/mediawiki/
      args:
        warn: false

    - name: Установить владельца www-data
      file:
        path: /var/www/mediawiki
        owner: www-data
        group: www-data
        recurse: yes

    - name: Разместить шаблон конфигурации Nginx для MediaWiki
      template:
        src: mediawiki_nginx.conf.j2
        dest: /etc/nginx/sites-available/mediawiki
      notify: reload nginx

    - name: Активировать сайт mediawiki
      file:
        src: /etc/nginx/sites-available/mediawiki
        dest: /etc/nginx/sites-enabled/mediawiki
        state: link

    - name: Удалить default сайт
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent

  handlers:
    - name: reload nginx
      systemd:
        name: nginx
        state: reloaded

# ---------- Часть 5. Настройка балансировщика Nginx ----------
- name: Настройка балансировщика
  hosts: lb
  become: yes
  vars:
    app1: "192.168.0.106"
    app2: "192.168.0.108"
  tasks:
    - name: Установить Nginx
      apt:
        name: nginx
        state: present

    - name: Создать конфигурацию балансировщика
      template:
        src: loadbalancer_nginx.conf.j2
        dest: /etc/nginx/sites-available/loadbalancer
      notify: reload nginx

    - name: Активировать сайт loadbalancer
      file:
        src: /etc/nginx/sites-available/loadbalancer
        dest: /etc/nginx/sites-enabled/loadbalancer
        state: link

    - name: Удалить default сайт
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent

  handlers:
    - name: reload nginx
      systemd:
        name: nginx
        state: reloaded

# ---------- Часть 6. Мониторинг ----------
- name: Установка Zabbix агента и Node Exporter
  hosts: all
  become: yes
  tasks:
    - name: Установить Zabbix агент
      apt:
        name: zabbix-agent
        state: present

    - name: Установить Node Exporter
      get_url:
        url: "https://github.com/prometheus/node_exporter/releases/download/v1.8.0/node_exporter-1.8.0.linux-amd64.tar.gz"
        dest: /tmp/node_exporter.tar.gz

    - name: Распаковать Node Exporter
      unarchive:
        src: /tmp/node_exporter.tar.gz
        dest: /tmp
        remote_src: yes

    - name: Переместить бинарник Node Exporter
      copy:
        src: /tmp/node_exporter-1.8.0.linux-amd64/node_exporter
        dest: /usr/local/bin/node_exporter
        mode: '0755'

    - name: Создать пользователя node_exporter
      user:
        name: node_exporter
        shell: /bin/false
        create_home: no

    - name: Создать systemd-юнит для Node Exporter
      copy:
        dest: /etc/systemd/system/node_exporter.service
        content: |
          [Unit]
          Description=Node Exporter
          After=network.target
          [Service]
          User=node_exporter
          ExecStart=/usr/local/bin/node_exporter
          [Install]
          WantedBy=multi-user.target

    - name: Запустить Node Exporter
      systemd:
        name: node_exporter
        state: started
        enabled: yes
