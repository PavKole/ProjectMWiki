---
- name: Общая подготовка всех узлов
  hosts: all
  become: yes
  tasks:
    - name: Установить базовые пакеты
      apt:
        name:
          - curl
          - ntp
          - htop
        state: present
        update_cache: yes

    - name: Запустить NTP
      systemd:
        name: ntp
        state: started
        enabled: yes

- name: Настройка PostgreSQL
  hosts: db
  become: yes
  vars:
    pg_version: "14"
    repuser_pass: "rep_password"
    wikiuser_pass: "wiki_password"
  tasks:
    - name: Установить PostgreSQL
      apt:
        name:
          - postgresql
          - postgresql-contrib
        state: present

    - name: Запустить PostgreSQL
      systemd:
        name: postgresql
        state: started
        enabled: yes

    - name: Настроить параметры primary
      become_user: postgres
      postgresql_set:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
      loop:
        - { name: "listen_addresses", value: "'*'" }
        - { name: "wal_level", value: "replica" }
        - { name: "max_wal_senders", value: "3" }
        - { name: "hot_standby", value: "on" }
      when: inventory_hostname == 'db1'

    - name: Создать пользователя repuser
      become_user: postgres
      postgresql_user:
        name: repuser
        password: "{{ repuser_pass }}"
        role_attr_flags: REPLICATION,LOGIN
      when: inventory_hostname == 'db1'

    - name: Создать пользователя wikiuser
      become_user: postgres
      postgresql_user:
        name: wikiuser
        password: "{{ wikiuser_pass }}"
      when: inventory_hostname == 'db1'

    - name: Создать базу my_wiki
      become_user: postgres
      postgresql_db:
        name: my_wiki
        owner: wikiuser
      when: inventory_hostname == 'db1'

    - name: Добавить правила в pg_hba.conf
      lineinfile:
        path: "/etc/postgresql/{{ pg_version }}/main/pg_hba.conf"
        line: "{{ item }}"
        insertafter: EOF
      loop:
        - "host    all             wikiuser        192.168.0.0/24            md5"
        - "host    replication     repuser         192.168.0.0/24            md5"
      when: inventory_hostname == 'db1'

    - name: Перезапустить PostgreSQL
      systemd:
        name: postgresql
        state: restarted
      when: inventory_hostname == 'db1'

- name: Настройка NFS-сервера
  hosts: nfs
  become: yes
  tasks:
    - name: Установить NFS-сервер
      apt:
        name: nfs-kernel-server
        state: present

    - name: Создать каталог
      file:
        path: /srv/nfs/mediawiki
        state: directory
        owner: www-data
        group: www-data
        mode: '0755'

    - name: Настроить экспорт
      lineinfile:
        path: /etc/exports
        line: "/srv/nfs/mediawiki 192.168.0.0/24(rw,sync,no_subtree_check,no_root_squash)"
        create: yes

    - name: Применить экспорт
      shell: exportfs -a && systemctl restart nfs-kernel-server

- name: Настройка серверов приложений
  hosts: app
  become: yes
  vars:
    mw_version: "1.42.1"
    nfs_ip: "192.168.0.111"
  tasks:
    - name: Установить Nginx, PHP-FPM и NFS-клиент
      apt:
        name:
          - nginx
          - php-fpm
          - php-pgsql
          - php-intl
          - php-mbstring
          - php-xml
          - php-apcu
          - php-curl
          - nfs-common
          - rsync
        state: present

    - name: Создать каталог MediaWiki
      file:
        path: /var/www/mediawiki
        state: directory
        owner: www-data
        group: www-data
        mode: '0755'

    - name: Смонтировать NFS
      mount:
        path: /var/www/mediawiki/images
        src: "{{ nfs_ip }}:/srv/nfs/mediawiki"
        fstype: nfs
        opts: defaults
        state: mounted

    - name: Скачать MediaWiki
      get_url:
        url: "https://releases.wikimedia.org/mediawiki/{{ mw_version }}/mediawiki-{{ mw_version }}.tar.gz"
        dest: /tmp/mediawiki.tar.gz

    - name: Распаковать MediaWiki
      unarchive:
        src: /tmp/mediawiki.tar.gz
        dest: /tmp
        remote_src: yes

    - name: Скопировать файлы
      shell: rsync -a --exclude='images' /tmp/mediawiki-{{ mw_version }}/ /var/www/mediawiki/

    - name: Назначить владельца
      file:
        path: /var/www/mediawiki
        owner: www-data
        group: www-data
        recurse: yes

    - name: Скопировать конфиг Nginx
      copy:
        src: files/mediawiki.conf
        dest: /etc/nginx/sites-available/mediawiki
      notify: reload nginx

    - name: Активировать сайт
      file:
        src: /etc/nginx/sites-available/mediawiki
        dest: /etc/nginx/sites-enabled/mediawiki
        state: link

    - name: Удалить default
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent

  handlers:
    - name: reload nginx
      systemd:
        name: nginx
        state: reloaded

- name: Настройка балансировщика
  hosts: lb
  become: yes
  tasks:
    - name: Установить Nginx
      apt:
        name: nginx
        state: present

    - name: Скопировать конфиг балансировщика
      copy:
        src: files/loadbalancer.conf
        dest: /etc/nginx/sites-available/loadbalancer
      notify: reload nginx

    - name: Активировать сайт
      file:
        src: /etc/nginx/sites-available/loadbalancer
        dest: /etc/nginx/sites-enabled/loadbalancer
        state: link

    - name: Удалить default
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent

  handlers:
    - name: reload nginx
      systemd:
        name: nginx
        state: reloaded

- name: Мониторинг
  hosts: all
  become: yes
  tasks:
    - name: Установить Zabbix-агент
      apt:
        name: zabbix-agent
        state: present

    - name: Скачать Node Exporter
      get_url:
        url: "https://github.com/prometheus/node_exporter/releases/download/v1.8.0/node_exporter-1.8.0.linux-amd64.tar.gz"
        dest: /tmp/node_exporter.tar.gz

    - name: Распаковать Node Exporter
      unarchive:
        src: /tmp/node_exporter.tar.gz
        dest: /tmp
        remote_src: yes

    - name: Установить бинарник
      copy:
        src: /tmp/node_exporter-1.8.0.linux-amd64/node_exporter
        dest: /usr/local/bin/node_exporter
        mode: '0755'

    - name: Создать пользователя node_exporter
      user:
        name: node_exporter
        shell: /bin/false
        create_home: no

    - name: Создать systemd-юнит
      copy:
        dest: /etc/systemd/system/node_exporter.service
        content: |
          [Unit]
          Description=Node Exporter
          After=network.target

          [Service]
          User=node_exporter
          ExecStart=/usr/local/bin/node_exporter

          [Install]
          WantedBy=multi-user.target

    - name: Запустить Node Exporter
      systemd:
        name: node_exporter
        state: started
        enabled: yes
